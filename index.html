<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bicí deník</title>

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./images/icon-180.png">
<meta name="apple-mobile-web-app-title" content="Bicí deník">
<meta name="theme-color" content="#f5f5f5">

<style>
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
}

.page{
    display:none;
    min-height:100dvh;
    padding:10px;
    box-sizing:border-box;
    overflow-y:auto;
}

.page.active{
    display:block;
}

header{
    display:flex;
    gap:6px;
    margin-bottom:10px;
}

button{
    cursor:pointer;
}

header button,
.footer button{
    flex:1;
    font-size:16px;
    padding:12px;
}

.form-row{
    margin-bottom:10px;
}

label{
    display:block;
    margin-bottom:4px;
    font-weight:bold;
}

select,
textarea,
input{
    width:100%;
    box-sizing:border-box;
    padding:10px;
    font-size:16px;
}

.footer{
    position:sticky;
    top:0;
    background:#fff;
    border-bottom:1px solid #ccc;
    padding:10px;
    display:flex;
    gap:10px;
    z-index:100;
}

.card{
    border-bottom:1px solid #ccc;
    padding:8px 0;
}

.card-title{
    font-weight:bold;
    margin-bottom:4px;
}

.description-item{
    padding:12px;
    border-bottom:1px solid #ccc;
    cursor:pointer;
    background:#fff;
}

.description-item:hover{
    background:#f0f0f0;
}

.summary{
    margin:12px 0;
    padding:8px;
    background:#ffffffcc;
    border-radius:6px;
}

.summary div{
    padding:2px 0;
}

.setting-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    border-bottom:1px solid #ddd;
    padding:6px 0;
}

.delete-btn{
    background:none;
    border:none;
    font-size:18px;
}

.filter-item{
    border-bottom:1px solid #ccc;
    padding:10px;
    cursor:pointer;
}

details{
    border-bottom:1px solid #ccc;
    padding:6px 0;
}

summary{
    cursor:pointer;
    font-weight:bold;
    padding:8px 0;
} 

.history-bg{
	position: relative;
}
.history-bg::before{
	content:"";
	position: absolute;
	inset: 0;
	z-index: 0;
	background:url("images/drumset.png") center/80% no-repeat;
 	opacity: 0.2;
	pointer-events: none;
}
.history-bg > *{
	position:relative;
	z-index:1;
}

.exercise-bg{
	position: relative;
}
.exercise-bg::before{
	content:"";
	position: absolute;
	inset: 0;
	z-index: 0;
	background:url("images/drumset.png") center/80% no-repeat;
 	opacity: 0.2;
	pointer-events: none;
}
.exercise-bg > *{
	position:relative;
	z-index:1;
}

.settings-bg{
	position: relative;
}
.settings-bg::before{
	content:"";
	position: absolute;
	inset: 0;
	z-index: 0;
	background:url("images/drumset.png") center/80% no-repeat;
 	opacity: 0.2;
	pointer-events: none;
}
.settings-bg > *{
	position:relative;
	z-index:1;
}

@media (orientation:landscape){

    header button,
    .footer button,
    select,
    textarea,
    input,
    label,
    .card,
    .card-title,
    summary{
        font-size:14px !important;
    }

}

</style>
</head>

<body>

<div id="historyPage" class="page active history-bg">

    <header>
        <button onclick="openExercise()">Cvičení</button>
        <button onclick="showFilter()">Filtr</button>
        <button onclick="showPage('settingsPage')">Nastavení</button>
    </header>

    <div id="historyList"></div>

</div>

<div id="exercisePage" class="page exercise-bg">

    <h2>Cvičení</h2>

    <div class="footer">
        <button onclick="showPage('historyPage')">Zpět</button>
        <button onclick="saveExercise()">Uložit</button>
    </div>

    <div class="form-row">
        <label>Typ cvičení</label>
        <select id="exerciseType" onchange="loadDescriptions()"></select>
    </div>

    <div class="form-row">
    	<label>Popis cvičení</label>

	<button
	        id="exerciseDescriptionButton"
	        type="button"
	        onclick="showDescriptionSelector()"
	        style="
	            width:100%;
	            text-align:left;
	            padding:10px;
	            font-size:16px;">
	        Vyber cvičení
	    </button>
    </div>

    <div class="form-row">
        <label>Metronom</label>
        <select id="exerciseBpm"></select>
    </div>

    <div class="form-row">
        <label>Opakování</label>
        <select id="exerciseRepeat">
            <option>1x</option>
            <option>2x</option>
            <option>3x</option>
            <option>4x</option>
            <option>5x</option>
            <option>5 min</option>
            <option>10 min</option>
            <option>15 min</option>
        </select>
    </div>

    <div class="form-row">
        <label>Poznámka</label>
        <textarea id="exerciseNote" rows="4"></textarea>
    </div>

</div>

<div id="settingsPage" class="page settings-bg">

    <h2>Nastavení</h2>

	<div class="footer">
	    <button onclick="showPage('historyPage')">Zpět</button>
	    <button onclick="saveSetting()">Uložit</button>
	</div>

    <div class="form-row">
        <label>Typ cvičení</label>
        <input type="text" id="newType">
    </div>

    <div class="form-row">
        <label>Popis cvičení</label>
        <textarea id="newDescription" rows="3"></textarea>
    </div>

    <h3>Seznam cvičení</h3>

    <div id="settingsList"></div>

	<br>

	<button onclick="exportData()">
	    Export dat
	</button>

	<br><br>

	<input
	    type="file"
	    id="importFile"
	    accept=".json"
	    onchange="importData(event)"
	    style="display:none;">

	<button onclick="
	document.getElementById('importFile').click()">
	    Import dat
	</button>

</div>

<div id="filterPage" class="page history-bg">

    <h2>Filtr</h2>

    <div class="footer">
        <button onclick="showPage('historyPage')">Zpět</button>
    </div>

    <div id="filterList"></div>

</div>

<div id="descriptionPage" class="page exercise-bg">

    <h2>Výběr cvičení</h2>

    <div class="footer">
        <button onclick="showPage('exercisePage')">
            Zpět
        </button>
    </div>

    <div id="descriptionList"></div>

</div>

<script>

let selectedDescription = "";

let currentFilter = "ALL";

function getSettings(){
    return JSON.parse(localStorage.getItem("settings") || "[]");
}

function getHistory(){
    return JSON.parse(localStorage.getItem("history") || "[]");
}

function saveSettings(data){
    localStorage.setItem("settings", JSON.stringify(data));
}

function saveHistoryData(data){
    localStorage.setItem("history", JSON.stringify(data));
}

function showPage(pageId){
    document.querySelectorAll(".page")
        .forEach(p=>p.classList.remove("active"));

    document.getElementById(pageId)
        .classList.add("active");
}

function saveSetting(){

    const type =
        document.getElementById("newType").value.trim();

    const description =
        document.getElementById("newDescription").value.trim();

    if(!type || !description){
        alert("Vyplň Typ i Popis.");
        return;
    }

    const settings = getSettings();

    settings.push({
        type,
        description
    });

    saveSettings(settings);

    document.getElementById("newType").value="";
    document.getElementById("newDescription").value="";

    renderSettings();
}

function renderSettings(){

    const settings = getSettings();

    settings.sort((a,b)=>
        a.type.localeCompare(b.type,"cs") ||
        a.description.localeCompare(b.description,"cs")
    );

    const grouped = {};

    settings.forEach(item => {

        if(!grouped[item.type]){
            grouped[item.type] = [];
        }

        grouped[item.type].push(item);
    });

    const list =
        document.getElementById("settingsList");

    list.innerHTML="";

    Object.keys(grouped)
        .sort((a,b) => a.localeCompare(b,"cs"))
        .forEach(type => {

        const details =
            document.createElement("details");

        const summary =
            document.createElement("summary");

        summary.textContent =
            `${type} (${grouped[type].length})`;

        details.appendChild(summary);

        grouped[type].forEach(item => {

            const originalIndex =
                settings.indexOf(item);

            const row =
                document.createElement("div");

            row.className="setting-row";

            row.innerHTML=`
                <div>
                    ${item.description}
                </div>

                <button class="delete-btn"
                        onclick="deleteSetting(${originalIndex})">
                    🗑
                </button>
            `;

            details.appendChild(row);
        });

        list.appendChild(details);
    });

    loadTypes();
}

function renderSummary(){

    const settings = getSettings();

    const counts = {};

    settings.forEach(item=>{
        counts[item.type]=(counts[item.type] || 0)+1;
    });

    const summary =
        document.getElementById("settingsSummary");

    const types =
        Object.keys(counts).sort();

    summary.innerHTML =
        types.map(t=>`${t} (${counts[t]})`).join("<br>");
}

function deleteSetting(index){

    if(!confirm("Opravdu smazat?")){
        return;
    }

    const settings=getSettings();

    settings.splice(index,1);

    saveSettings(settings);

    renderSettings();
}

function loadTypes(){

    const settings=getSettings();

    const types = [
	    ...new Set(settings.map(s => s.type))
    ].sort((a, b) => a.localeCompare(b, "cs"));

    const select=
        document.getElementById("exerciseType");

    select.innerHTML="";

    types.forEach(type=>{

        const option =
            document.createElement("option");

        option.value=type;
        option.textContent=type;

        select.appendChild(option);
    });

    loadDescriptions();
}

function loadDescriptions(){

    selectedDescription = "";

    document.getElementById("exerciseDescriptionButton").textContent = "Vyber cvičení";

	loadLastValues();
}

function showDescriptionSelector(){

    const type =
        document.getElementById("exerciseType").value;

    const descriptions =
        getSettings()
            .filter(s => s.type === type)
            .sort((a,b) =>
                a.description.localeCompare(
                    b.description,
                    "cs"
                )
            );

    const list =
        document.getElementById("descriptionList");

    list.innerHTML = "";

    descriptions.forEach(item => {

        const div =
            document.createElement("div");

        div.className = "description-item";

        div.textContent =
            item.description;

        div.onclick = () => {

            selectedDescription =
                item.description;

            document.getElementById(
                "exerciseDescriptionButton"
            ).textContent =
                item.description;

            loadLastValues();

            showPage("exercisePage");
        };

        list.appendChild(div);
    });

    showPage("descriptionPage");
}

function loadLastValues(){
	const type =
		document.getElementById("exerciseType").value;
	const description =
		selectedDescription;
	const last =
		getHistory().find(h =>
			h.type === type &&
			h.description === description
	);
	if(!last){
		document.getElementById("exerciseBpm").value = "0";
		document.getElementById("exerciseRepeat").value = "1x";
	document.getElementById("exerciseNote").value = "";
	return;
	}
	document.getElementById("exerciseBpm").value =
		last.bpm;
	document.getElementById("exerciseRepeat").value =
		last.repeat;
	document.getElementById("exerciseNote").value =
		last.note || "";
}


function openExercise(){

    loadTypes();

    showPage("exercisePage");
}

function createBpmList(){

    const select=
        document.getElementById("exerciseBpm");

    for(let bpm=0;bpm<=240;bpm+=5){

        const option=
            document.createElement("option");

        option.value=bpm;
        option.textContent=bpm;

        select.appendChild(option);
    }
}

function saveExercise(){

    const type =
        document.getElementById("exerciseType").value;

    const description =
        selectedDescription;

    if(!type || !description){
        alert("Vyber Typ a Popis.");
        return;
    }

    const history=getHistory();

    history.unshift({

        date:new Date().toLocaleDateString("cs-CZ"),

        type:type,

        description:description,

        bpm:
        document.getElementById("exerciseBpm").value,

        repeat:
        document.getElementById("exerciseRepeat").value,

        note:
        document.getElementById("exerciseNote").value
    });

	saveHistoryData(history);

	selectedDescription = "";document.getElementById("exerciseDescriptionButton").textContent = "Vyber cvičení";

	document.getElementById("exerciseNote").value="";
	renderHistory();
	showPage("historyPage");
}

function renderHistory(){

    const history=getHistory();

    const list =
        document.getElementById("historyList");

    list.innerHTML="";

    history
        .filter(h=>
            currentFilter==="ALL"
            || h.type===currentFilter
        )
        .forEach(item=>{

        const card=document.createElement("div");

        card.className="card";

        card.innerHTML=`
            <div class="card-title">
                ${item.date}
                |
                ${item.type}
                |
                ${item.bpm} BPM
                |
                ${item.repeat}
            </div>

            <div>${item.description}</div>

            ${item.note ?
                `<div><em>${item.note}</em></div>`
                :
                ""
            }
        `;

        list.appendChild(card);
    });
}

function showFilter(){

    const settings=getSettings();

    const counts={};

    getHistory().forEach(h=>{
        counts[h.type]=(counts[h.type] || 0)+1;
    });

    const types=[
        ...new Set(settings.map(s=>s.type))
    ].sort((a, b) => a.localeCompare(b, "cs"));

    const list=
        document.getElementById("filterList");

    list.innerHTML="";

    const allDiv=document.createElement("div");

    allDiv.className="filter-item";

    allDiv.textContent=
        `Vše (${getHistory().length})`;

    allDiv.onclick=()=>{

        currentFilter="ALL";

        renderHistory();

        showPage("historyPage");
    };

    list.appendChild(allDiv);

    types.forEach(type=>{

        const div=document.createElement("div");

        div.className="filter-item";

        div.textContent=
            `${type} (${counts[type] || 0})`;

        div.onclick=()=>{

            currentFilter=type;

            renderHistory();

            showPage("historyPage");
        };

        list.appendChild(div);
    });

    showPage("filterPage");
}

function exportData(){

    const data = {

        settings:getSettings(),
        history:getHistory()

    };

    const json =
        JSON.stringify(data,null,2);

    const blob =
        new Blob(
            [json],
            {type:"application/json"}
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    const date =
        new Date()
        .toISOString()
        .split("T")[0];

    link.href = url;

    link.download =
        `bici-denik-${date}.json`;

    link.click();

    URL.revokeObjectURL(url);
}

function importData(event){

    const file =
        event.target.files[0];

    if(!file){
        return;
    }

    const reader =
        new FileReader();

    reader.onload = function(e){

        try{

            const data =
                JSON.parse(e.target.result);

            if(
                !data.settings ||
                !data.history
            ){
                throw new Error();
            }

            saveSettings(
                data.settings
            );

            saveHistoryData(
                data.history
            );

            renderSettings();
            renderHistory();

            alert(
                "Import dokončen."
            );

        }catch(error){

            alert(
                "Soubor není platná záloha."
            );
        }
    };

    reader.readAsText(file);
}

createBpmList();
renderSettings();
renderHistory();

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker
            .register("./service-worker.js")
            .then(() => {
                console.log("Service Worker aktivní");
            })
            .catch(err => {
                console.error("SW chyba:", err);
            });

    });

}

</script>

</body>
</html>
